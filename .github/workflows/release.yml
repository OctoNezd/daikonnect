name: Release

# Cut a release by pushing a tag, or run it by hand and give a version.
#
# A tag like v1.2.0 sets both numbers the build carries: the version
# (CFBundleShortVersionString, what people see) is the tag without its "v",
# and the build (CFBundleVersion, what Sparkle compares) is a monotonic
# integer folded from the version parts — major*10000 + minor*100 + patch, so
# v1.1.0 is 10100 and still newer than v1.0.3's 10003.
#
# Signing: by default the build is ad-hoc signed, which is enough to run but
# means each release is a different code identity — so macOS treats every
# release as a new app and re-asks for the Local Network permission. Supplying
# a certificate makes that stable.
#
# Two secrets enable it, both optional:
#
#   SIGNING_CERTIFICATE_P12       base64 of a .p12 containing certificate + key
#   SIGNING_CERTIFICATE_PASSWORD  the password that .p12 was exported with
#
# Make them with the script, which generates a certificate for this purpose
# and puts the base64 on the clipboard along with the password to store:
#
#   Scripts/make-signing-identity.sh --ci
#
# Do not use `security export -t identities` for this: it offers every identity
# in the keychain, an Apple one among them, which is not what a self-signed
# build should be signed with. To reuse an existing identity instead, export
# it from Keychain Access — My Certificates, pick the certificate by name,
# right-click, Export — and base64 that file.
#
# Updates: the app updates through Sparkle, and each release publishes an
# appcast.xml beside the disk image — Sparkle's feed URL is
# .../releases/latest/download/appcast.xml. Signing that appcast needs one more
# secret, the EdDSA private key:
#
#   SPARKLE_ED_PRIVATE_KEY  the private key exported by Sparkle's generate_keys
#                           (`generate_keys -x FILE` writes it out)
#
# Without it the release still builds, but no appcast is published, so existing
# installs cannot see the update.
#
# A self-signed certificate is enough for the identity to stay stable. It does
# not silence the "unidentified developer" warning on someone else's Mac —
# only an Apple Developer ID certificate plus notarisation does that, and both
# are secrets of the same shape (the notarisation step needs an App Store
# Connect key or an app-specific password).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.75 (its number becomes the build number)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Xcode 27 (macOS 27) on purpose: the app icon is an Icon Composer 2.0
    # document, and Xcode 26's actool cannot open it — on macos-latest the
    # build dies with "Could not open AppIcon.icon" and an actool exception.
    # This is a public-preview image; move it to a stable label once one
    # carries Xcode 27.
    runs-on: xcode-27
    env:
      # Job-level so it can be tested in a step's `if`; secrets cannot be
      # referenced there directly.
      SIGNING_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Work out the version and build number
        id: version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          # A tag like v1.1.0 or v1.2: the version is what people see, and the
          # build is the integer both the app and Sparkle compare. The build
          # cannot be the tag's trailing digits, because v1.1.0 would then be
          # build 0 — older than v1.0.3. Fold the components instead.
          VERSION="${TAG#v}"
          OLDIFS="$IFS"; IFS=.
          set -- $VERSION
          IFS="$OLDIFS"
          MAJOR="${1:-0}"; MINOR="${2:-0}"; PATCH="${3:-0}"
          for part in "$MAJOR" "$MINOR" "$PATCH"; do
            case "$part" in
              ''|*[!0-9]*)
                echo "Tag '$TAG' is not v<major>[.<minor>[.<patch>]]." >&2
                exit 1
                ;;
            esac
          done
          BUILD=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Release $TAG: version $VERSION, build $BUILD"

      - name: Import the signing certificate
        id: signing
        if: env.SIGNING_P12 != ''
        env:
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign stops on a keychain prompt it cannot answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/identity.p12"
          # No -v: that lists only *trusted* identities, and a self-signed
          # certificate is not trusted — it would report none and the build
          # would then fail to find what was just imported.
          NAME="$(security find-identity -p codesigning "$KEYCHAIN" | grep -oE '"[^"]+"' | head -1 | tr -d '"')"
          if [ -z "$NAME" ]; then
            echo "The certificate imported but no signing identity was found." >&2
            exit 1
          fi
          echo "Using signing identity: $NAME"
          echo "identity=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # The build number both the app and Sparkle compare, from the tag.
          DAIKONNECT_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          # Ad-hoc when no certificate was supplied.
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        run: |
          xcodebuild \
            -project daiKonnect.xcodeproj \
            -scheme MyApp \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$DAIKONNECT_BUILD_NUMBER" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: Check the version and build number took
        run: |
          PLIST=build/Build/Products/Release/daiKonnect.app/Contents/Info.plist
          GOT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "CFBundleShortVersionString = $VER, expected ${{ steps.version.outputs.version }}"
          echo "CFBundleVersion = $GOT, expected ${{ steps.version.outputs.build }}"
          [ "$VER" = "${{ steps.version.outputs.version }}" ]
          [ "$GOT" = "${{ steps.version.outputs.build }}" ]

      - name: Check what signed it
        run: |
          codesign -dv build/Build/Products/Release/daiKonnect.app 2>&1 | grep -E 'Authority|Signature|flags' || true

      - name: Package the disk image
        run: |
          Scripts/make-dmg.sh \
            build/Build/Products/Release/daiKonnect.app \
            "daiKonnect-${{ steps.version.outputs.tag }}.dmg"

      - name: Build the appcast
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BIN="build/SourcePackages/artifacts/sparkle/Sparkle/bin"
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "No SPARKLE_ED_PRIVATE_KEY secret; publishing without an appcast."
            exit 0
          fi
          if [ ! -x "$BIN/generate_appcast" ]; then
            echo "Sparkle's generate_appcast was not found at $BIN" >&2
            exit 1
          fi
          mkdir -p updates
          cp "daiKonnect-$TAG.dmg" updates/
          # The private key travels on stdin, so it never lands in an argument
          # list or the process table.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            -o updates/appcast.xml \
            updates
          echo "Publishing appcast for $TAG:"
          head -c 600 updates/appcast.xml
          echo "path=updates/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=("daiKonnect-${{ steps.version.outputs.tag }}.dmg")
          if [ -f "${{ steps.appcast.outputs.path }}" ]; then
            ASSETS+=("${{ steps.appcast.outputs.path }}")
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "${ASSETS[@]}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
